<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #e8e0d0;
      --surface:    #1e1408;
      --surface-2:  #2a1c10;
      --border:     #3a2818;
      --accent:     #c8732a;
      --warn:       #e03020;
      --warn-bg:    #2e1008;
      --warn-bd:    #6a1e14;
      --ok:         #4ab85a;
      --ok-bg:      #0e2212;
      --text:       #f8f0e4;
      --text-2:     #c09a7a;
      --text-3:     #7a6050;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 24px 60px;
    }

    header {
      max-width: 1320px;
      margin: 0 auto 36px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      border-bottom: 1.5px solid #b09870;
      padding-bottom: 24px;
    }

    .logo-block h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
      line-height: 1;
    }

    .logo-block p {
      font-size: 12px;
      color: #7a6050;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .clock {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: #6b5030;
      text-align: right;
      line-height: 1.6;
    }

    .clock strong {
      display: block;
      font-size: 24px;
      color: #2a1f14;
      letter-spacing: -0.02em;
    }

    .summary {
      max-width: 1320px;
      margin: 0 auto 32px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-2);
    }

    .stat-val {
      font-family: 'Fraunces', serif;
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
    }

    .stat-val.red   { color: #ff5040; }
    .stat-val.green { color: var(--ok); }

    .grid {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.25s, box-shadow 0.25s, background 0.3s, border 0.3s;
      animation: fadeIn 0.35s ease both;
      color: var(--text);
      font-size: 14px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(0,0,0,0.5);
    }

    .card.calling {
      border: 1.5px solid var(--warn-bd);
      background: var(--warn-bg);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .table-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-3);
    }

    .table-num {
      font-family: 'Fraunces', serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .batt-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }

    .batt-shell {
      width: 50px; height: 20px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      position: relative;
      padding: 2px;
    }

    .batt-shell::after {
      content: '';
      position: absolute;
      right: -5px; top: 50%;
      transform: translateY(-50%);
      width: 4px; height: 10px;
      background: var(--border);
      border-radius: 0 2px 2px 0;
    }

    .batt-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .batt-pct {
      font-size: 14px;
      color: var(--text);
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 46px;
    }

    .card-icon {
      font-size: 42px;
      line-height: 1;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
    }

    .card-alert {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      flex: 1 1 auto;
    }

    .card-alert-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--warn);
      flex-shrink: 0;
      animation: pulse 1s infinite;
    }

    .card .table-label,
    .card .table-num,
    .card .batt-pct,
    .card .status-text {
      color: var(--text);
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    .card.calling .divider { background: var(--warn-bd); }

    /* Status ready */
    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 13px;
      border-radius: 10px;
      background: var(--ok-bg);
    }

    .card.calling .status { display: none; }
    .card:not(.calling) .card-alert { display: none; }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--ok);
      flex-shrink: 0;
    }

    .status-text {
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      font-weight: 500;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(224,48,32,0.8); }
      70%  { box-shadow: 0 0 0 12px rgba(224,48,32,0); }
      100% { box-shadow: 0 0 0 0 rgba(224,48,32,0); }
    }

    /* Confirm button */
    .btn-confirm {
      display: none;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--warn);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .card.calling .btn-confirm { display: block; }

    .btn-confirm:hover  { background: #b01e10; }
    .btn-confirm:active { transform: scale(0.98); }

    @media (max-width: 500px) {
      header { flex-direction: column; align-items: flex-start; }
      .clock { text-align: left; }
      .summary { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-block">
      <h1>Café Manager</h1>
      <p>Table call system · Live view</p>
    </div>
    <div class="clock">
      <strong id="clock-time">--:--</strong>
      <span id="clock-date">Loading…</span>
    </div>
  </header>

  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>

  <script>
    const tables = [
      { id:"01", batt:88, waiting:true,  icon:"☕" },
      { id:"02", batt:72, waiting:true,  icon:"☕" },
      { id:"03", batt:12, waiting:true,  icon:"☕" },
      { id:"04", batt:60, waiting:false, icon:"☕" },
      { id:"05", batt:34, waiting:false, icon:"☕" },
      { id:"06", batt:98, waiting:false, icon:"☕" },
      { id:"07", batt:45, waiting:true,  icon:"☕" },
      { id:"08", batt:82, waiting:false, icon:"☕" },
      { id:"09", batt:19, waiting:false, icon:"☕" },
      { id:"10", batt:91, waiting:true,  icon:"☕" },
      { id:"11", batt:55, waiting:false, icon:"☕" },
      { id:"12", batt:67, waiting:false, icon:"☕" }
    ];

    function battColor(p) {
      if (p < 20) return '#e03020';
      if (p < 40) return '#d08020';
      return '#4ab85a';
    }

    function updateSummary() {
      const calling = tables.filter(t => t.waiting).length;
      const lowBatt = tables.filter(t => t.batt < 20).length;
      const ready   = tables.length - calling;
      document.getElementById('summary').innerHTML = `
        <div class="stat">
          <span class="stat-label">Calling</span>
          <span class="stat-val ${calling > 0 ? 'red' : 'green'}">${calling}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Low battery</span>
          <span class="stat-val ${lowBatt > 0 ? 'red' : ''}">${lowBatt}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Ready</span>
          <span class="stat-val green">${ready}</span>
        </div>
      `;
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      tables.forEach((t, i) => {
        const card = document.createElement('div');
        card.className = 'card' + (t.waiting ? ' calling' : '');
        card.id = 'card-' + t.id;
        card.style.animationDelay = (i * 0.04) + 's';
        card.innerHTML = `
          <div class="card-top">
            <div>
              <div class="table-label">Table</div>
              <div class="table-num">${t.id}</div>
            </div>
            <div class="batt-wrap">
              <div class="batt-shell">
                <div class="batt-fill" style="width:${t.batt}%; background:${battColor(t.batt)}"></div>
              </div>
              <span class="batt-pct">${t.batt}%</span>
            </div>
          </div>
          <div class="card-meta">
            <div class="card-icon">${t.icon}</div>
            <div class="card-alert">
              <span class="card-alert-dot"></span>
            </div>
          </div>
          <div class="divider"></div>
          <div class="status">
            <div class="dot"></div>
            <span class="status-text">Ready</span>
          </div>
          <button type="button" class="btn-confirm" onclick="dismiss(event, '${t.id}')">Confirm receipt</button>
        `;
        grid.appendChild(card);
      });
    }

    function dismiss(event, id) {
      event.preventDefault();
      const idx = tables.findIndex(t => t.id === id);
      
      if (idx > -1) {
        // 1. Update the data
        tables[idx].waiting = false;

        const card = document.getElementById('card-' + id);
        if (card) {
          card.classList.remove('calling');
        }

        
        updateSummary();
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent =
        now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      document.getElementById('clock-date').textContent =
        now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    }

    updateClock();
    setInterval(updateClock, 1000);
    updateSummary();
    renderGrid();
  </script>
</body>
</html>
