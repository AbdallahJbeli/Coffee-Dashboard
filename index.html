<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #e8e0d0;
      --surface: #1e1408;
      --border:  #3a2818;
      --accent:  #c8732a;
      --warn:    #e03020;
      --warn-bg: #2e1008;
      --warn-bd: #6a1e14;
      --ok:      #4ab85a;
      --ok-bg:   #0e2212;
      --text:    #f8f0e4;
      --text-2:  #e0c8a8;
      --text-3:  #b89878;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 24px 60px;
    }

    /* ── HEADER ── */
    header {
      max-width: 1320px;
      margin: 0 auto 36px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      border-bottom: 1.5px solid #b09870;
      padding-bottom: 24px;
    }
    .logo-block h1 { font-family:'Fraunces',serif; font-size:clamp(2rem,5vw,3.2rem); font-weight:700; letter-spacing:-0.02em; color:var(--accent); line-height:1; }
    .logo-block p  { font-size:12px; color:#7a6050; letter-spacing:0.12em; text-transform:uppercase; margin-top:6px; }
    .header-right  { display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
    .clock         { font-family:'DM Mono',monospace; font-size:14px; color:#6b5030; text-align:right; line-height:1.6; }
    .clock strong  { display:block; font-size:24px; color:#2a1f14; letter-spacing:-0.02em; }
    .btn-report    { display:flex; align-items:center; gap:8px; padding:10px 20px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-family:'DM Mono',monospace; font-size:13px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:background 0.2s,transform 0.1s; }
    .btn-report:hover  { background:#a05820; }
    .btn-report:active { transform:scale(0.97); }
    .btn-report svg { width:16px; height:16px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

    /* ── SUMMARY ── */
    .summary { max-width:1320px; margin:0 auto 32px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 24px; display:flex; flex-direction:column; gap:4px; }
    .stat-label { font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-2); }
    .stat-val   { font-family:'Fraunces',serif; font-size:42px; font-weight:700; line-height:1; color:var(--text); }
    .stat-val.red   { color:#ff5040; }
    .stat-val.green { color:var(--ok); }

    /* ── GRID ── */
    .grid { max-width:1320px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:22px 24px 20px; display:flex; flex-direction:column; gap:14px; transition:transform 0.25s,box-shadow 0.25s,background 0.3s,border 0.3s; animation:fadeIn 0.35s ease both; font-size:14px; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .card:hover   { transform:translateY(-2px); box-shadow:0 10px 32px rgba(0,0,0,0.5); }
    .card.calling { border:1.5px solid var(--warn-bd); background:var(--warn-bg); }
    .card-top     { display:flex; justify-content:space-between; align-items:flex-start; }
    .table-label  { font-size:13px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-3); }
    .table-num    { font-family:'Fraunces',serif; font-size:40px; font-weight:700; color:var(--text); line-height:1; }
    .batt-wrap    { display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
    .batt-shell   { width:50px; height:20px; border:1.5px solid var(--border); border-radius:5px; position:relative; padding:2px; }
    .batt-shell::after { content:''; position:absolute; right:-5px; top:50%; transform:translateY(-50%); width:4px; height:10px; background:var(--border); border-radius:0 2px 2px 0; }
    .batt-fill    { height:100%; border-radius:3px; transition:width 0.4s ease; }
    .batt-pct     { font-size:14px; color:var(--text); letter-spacing:0.04em; font-weight:600; }
    .card-meta    { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; min-height:46px; }
    .card-icon    { font-size:42px; line-height:1; display:flex; align-items:center; flex:0 0 auto; }
    .card-alert   { display:flex; align-items:center; justify-content:flex-end; min-width:0; flex:1 1 auto; }
    .card-alert-dot { width:18px; height:18px; border-radius:50%; background:var(--warn); flex-shrink:0; animation:pulse 1s infinite; }
    .divider      { height:1px; background:var(--border); }
    .card.calling .divider { background:var(--warn-bd); }
    .status       { display:flex; align-items:center; gap:9px; padding:10px 13px; border-radius:10px; background:var(--ok-bg); }
    .card.calling .status      { display:none; }
    .card:not(.calling) .card-alert { display:none; }
    .dot          { width:10px; height:10px; border-radius:50%; background:var(--ok); flex-shrink:0; }
    .status-text  { font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text); font-weight:500; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(224,48,32,0.8)} 70%{box-shadow:0 0 0 12px rgba(224,48,32,0)} 100%{box-shadow:0 0 0 0 rgba(224,48,32,0)} }
    .btn-confirm  { display:none; width:100%; padding:14px; border:none; border-radius:10px; background:var(--warn); color:#fff; font-family:'DM Mono',monospace; font-size:13px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:background 0.2s,transform 0.1s; }
    .card.calling .btn-confirm { display:block; }
    .btn-confirm:hover  { background:#b01e10; }
    .btn-confirm:active { transform:scale(0.98); }

    /* ══════════════════════════════
       MODAL
    ══════════════════════════════ */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(6,3,1,0.88); z-index:1000; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.open { display:flex; }
    .modal { background:#0f0a04; border:1px solid #5a3820; border-radius:22px; width:100%; max-width:780px; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; animation:modalIn 0.25s ease both; }
    @keyframes modalIn { from{opacity:0;transform:scale(0.96) translateY(12px)} to{opacity:1;transform:scale(1) translateY(0)} }

    /* modal header */
    .modal-header { display:flex; align-items:center; justify-content:space-between; padding:24px 28px 20px; border-bottom:1px solid #5a3820; flex-shrink:0; }
    .modal-header h2 { font-family:'Fraunces',serif; font-size:24px; font-weight:700; color:var(--accent); }
    .modal-header p  { font-size:12px; color:#ffffff; margin-top:4px; text-transform:uppercase; letter-spacing:0.12em; }
    .modal-close { width:36px; height:36px; border-radius:50%; border:1px solid #5a3820; background:transparent; color:#ffffff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s,color 0.2s; flex-shrink:0; }
    .modal-close:hover { background:var(--warn-bg); color:var(--warn); }

    /* date picker */
    .date-picker { display:flex; align-items:center; gap:10px; padding:14px 28px; border-bottom:1px solid #5a3820; flex-shrink:0; }
    .date-picker label  { font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:#ffffff; font-weight:500; }
    .date-picker select { background:#1a1008; border:1px solid #5a3820; color:#ffffff; font-family:'DM Mono',monospace; font-size:12px; padding:7px 12px; border-radius:8px; cursor:pointer; outline:none; }
    .date-picker select:focus { border-color:var(--accent); }
    .date-picker select option { background:#1a1008; color:#ffffff; }

    /* tab bar */
    .tab-bar { display:flex; padding:14px 28px 0; border-bottom:1px solid #5a3820; flex-shrink:0; overflow-x:auto; }
    .tab-btn { padding:8px 20px 13px; border:none; background:transparent; color:#d4b896; font-family:'DM Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.12em; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; transition:color 0.2s,border-color 0.2s; }
    .tab-btn:hover  { color:#ffffff; }
    .tab-btn.active { color:#ffffff; border-bottom-color:var(--accent); }

    /* modal body */
    .modal-body { overflow-y:auto; padding:24px 28px; flex:1; }
    .modal-body::-webkit-scrollbar { width:5px; }
    .modal-body::-webkit-scrollbar-track { background:transparent; }
    .modal-body::-webkit-scrollbar-thumb { background:#5a3820; border-radius:3px; }

    /* ── KPI CARDS ── */
    .report-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:24px; }
    .r-stat { background:#1a1008; border:1px solid #5a3820; border-radius:12px; padding:16px; }
    .r-stat-label { font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:#ffffff; margin-bottom:8px; opacity:0.7; }
    .r-stat-val   { font-family:'Fraunces',serif; font-size:30px; font-weight:700; color:#ffffff; line-height:1; }
    .r-stat-val.orange { color:#e8923a; }
    .r-stat-val.red    { color:#ff6050; }
    .r-stat-val.green  { color:#5ad86a; }

    /* ── REPORT TABLE ── */
    .report-table { width:100%; border-collapse:collapse; font-size:13px; }
    .report-table th {
      text-align:left;
      padding:11px 16px;
      font-size:11px;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:#ffffff;
      border-bottom:2px solid #5a3820;
      background:#1a1008;
    }
    .report-table th:not(:first-child) { text-align:center; }
    .report-table td {
      padding:13px 16px;
      border-bottom:1px solid #2e1c0e;
      color:#ffffff;
      vertical-align:middle;
    }
    .report-table td:not(:first-child) { text-align:center; }
    .report-table tr:last-child td { border-bottom:none; }
    .report-table tr:hover td { background:#1a1008; }
    .td-table-num { font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:#ffffff; }

    .pill { display:inline-block; padding:4px 12px; border-radius:20px; font-size:11px; letter-spacing:0.08em; font-weight:600; }
    .pill-red   { background:#3a1008; color:#ff8070; border:1px solid #8a2e14; }
    .pill-green { background:#0e2212; color:#5ad86a; border:1px solid #1e6a2a; }

    /* ── TIMELINE ── */
    .timeline { display:flex; flex-direction:column; }
    .tl-item  { display:flex; gap:16px; padding:15px 0; border-bottom:1px solid #2e1c0e; align-items:flex-start; }
    .tl-item:last-child { border-bottom:none; }
    .tl-time    { font-size:12px; color:#ffffff; white-space:nowrap; min-width:76px; padding-top:2px; opacity:0.7; }
    .tl-dot     { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:4px; }
    .tl-title   { font-size:13px; color:#ffffff; margin-bottom:3px; font-weight:500; }
    .tl-sub     { font-size:12px; color:#ffffff; opacity:0.65; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align:center; padding:50px 20px; }
    .empty-state .es-icon { font-size:48px; margin-bottom:16px; opacity:0.35; }
    .empty-state p { font-size:14px; color:#ffffff; opacity:0.6; line-height:1.8; }

    /* ── BAR CHART ── */
    .chart-container { margin-top:4px; background:#1a1008; border:1px solid #5a3820; border-radius:12px; padding:18px 14px 12px; }
    .chart-label { font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:#ffffff; opacity:0.7; margin-bottom:16px; }

    /* ── MODAL FOOTER ── */
    .modal-footer { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-top:1px solid #5a3820; flex-shrink:0; gap:12px; flex-wrap:wrap; }
    .modal-footer p { font-size:11px; color:#ffffff; letter-spacing:0.08em; opacity:0.7; }
    .btn-export-pdf { display:flex; align-items:center; gap:8px; padding:10px 20px; background:transparent; border:1.5px solid #8a3e20; border-radius:9px; color:#ff9070; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:background 0.2s,color 0.2s,border-color 0.2s; }
    .btn-export-pdf:hover  { background:#2e1008; color:#ffb090; border-color:#b05030; }
    .btn-export-pdf:active { transform:scale(0.97); }
    .btn-export-pdf svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    @media (max-width:600px) {
      header { flex-direction:column; align-items:flex-start; }
      .header-right { align-items:flex-start; }
      .clock { text-align:left; }
      .summary { grid-template-columns:1fr 1fr; }
      .report-stats { grid-template-columns:repeat(2,1fr); }
      .modal-header { padding:18px; }
      .tab-bar, .date-picker, .modal-body, .modal-footer { padding-left:18px; padding-right:18px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-block">
      <h1>Café Manager</h1>
      <p>Système d'appel de table · Vue en direct</p>
    </div>
    <div class="header-right">
      <div class="clock">
        <strong id="clock-time">--:--</strong>
        <span id="clock-date">Chargement…</span>
      </div>
      <button class="btn-report" onclick="openReport()">
        <svg viewBox="0 0 24 24"><path d="M9 17H7a2 2 0 01-2-2V5a2 2 0 012-2h10a2 2 0 012 2v1"/><rect x="9" y="11" width="13" height="10" rx="2"/><path d="M13 15h5M13 18h3"/></svg>
        Rapport du jour
      </button>
    </div>
  </header>

  <div class="summary" id="summary"></div>
  <div class="grid"    id="grid"></div>

  <!-- ══ MODAL ══ -->
  <div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
    <div class="modal">

      <div class="modal-header">
        <div>
          <h2>Rapport journalier</h2>
          <p id="modal-subtitle">Chargement…</p>
        </div>
        <button class="modal-close" onclick="closeReport()" aria-label="Fermer">×</button>
      </div>

      <div class="date-picker">
        <label for="date-select">Date</label>
        <select id="date-select" onchange="onDateChange()"></select>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('summary',this)">Résumé</button>
        <button class="tab-btn"        onclick="switchTab('tables',this)">Par table</button>
        <button class="tab-btn"        onclick="switchTab('timeline',this)">Chronologie</button>
      </div>

      <div class="modal-body" id="modal-body"></div>

      <div class="modal-footer">
        <p id="modal-footer-info">—</p>
        <button class="btn-export-pdf" onclick="exportPDF()">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="18" x2="13" y2="18"/></svg>
          Exporter PDF
        </button>
      </div>

    </div>
  </div>

  <script>
    /* ── DONNÉES ── */
    const tables = [
      { id:"01", batt:88, waiting:true,  icon:"☕" },
      { id:"02", batt:72, waiting:true,  icon:"☕" },
      { id:"03", batt:12, waiting:true,  icon:"☕" },
      { id:"04", batt:60, waiting:false, icon:"☕" },
      { id:"05", batt:34, waiting:false, icon:"☕" },
      { id:"06", batt:98, waiting:false, icon:"☕" },
      { id:"07", batt:45, waiting:true,  icon:"☕" },
      { id:"08", batt:82, waiting:false, icon:"☕" },
      { id:"09", batt:19, waiting:false, icon:"☕" },
      { id:"10", batt:91, waiting:true,  icon:"☕" },
      { id:"11", batt:55, waiting:false, icon:"☕" },
      { id:"12", batt:67, waiting:false, icon:"☕" }
    ];

    /* ── LOG ── */
    const LOG_KEY = 'cafe_log_v1';
    function todayKey() { return new Date().toISOString().slice(0,10); }
    function loadLog()  { try { return JSON.parse(localStorage.getItem(LOG_KEY)||'{}'); } catch(e){ return {}; } }
    function saveLog(l) { localStorage.setItem(LOG_KEY, JSON.stringify(l)); }

    function logEvent(tableId, batt, status) {
      const log = loadLog(), day = todayKey();
      if (!log[day]) log[day] = { events:[] };
      const e = { table:tableId, batt, status };
      e[status==='dismissed' ? 'dismissedAt' : 'calledAt'] = new Date().toISOString();
      log[day].events.push(e);
      saveLog(log);
    }

    /* ── BATTERIE ── */
    function battColor(p) {
      if (p < 20) return '#e03020';
      if (p < 40) return '#d08020';
      return '#4ab85a';
    }

    /* ── RÉSUMÉ HAUT ── */
    function updateSummary() {
      const calling = tables.filter(t=>t.waiting).length;
      const lowBatt = tables.filter(t=>t.batt<20).length;
      const ready   = tables.length - calling;
      document.getElementById('summary').innerHTML = `
        <div class="stat"><span class="stat-label">En appel</span><span class="stat-val ${calling>0?'red':'green'}">${calling}</span></div>
        <div class="stat"><span class="stat-label">Batterie faible</span><span class="stat-val ${lowBatt>0?'red':''}">${lowBatt}</span></div>
        <div class="stat"><span class="stat-label">Disponible</span><span class="stat-val green">${ready}</span></div>
      `;
    }

    /* ── GRILLE ── */
    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      tables.forEach((t,i) => {
        const card = document.createElement('div');
        card.className = 'card'+(t.waiting?' calling':'');
        card.id = 'card-'+t.id;
        card.style.animationDelay = (i*0.04)+'s';
        card.innerHTML = `
          <div class="card-top">
            <div><div class="table-label">Table</div><div class="table-num">${t.id}</div></div>
            <div class="batt-wrap">
              <div class="batt-shell"><div class="batt-fill" style="width:${t.batt}%;background:${battColor(t.batt)}"></div></div>
              <span class="batt-pct">${t.batt}%</span>
            </div>
          </div>
          <div class="card-meta">
            <div class="card-icon">${t.icon}</div>
            <div class="card-alert"><span class="card-alert-dot"></span></div>
          </div>
          <div class="divider"></div>
          <div class="status"><div class="dot"></div><span class="status-text">Disponible</span></div>
          <button type="button" class="btn-confirm" onclick="dismiss(event,'${t.id}')">Confirmer la réception</button>
        `;
        grid.appendChild(card);
      });
    }

    /* ── CONFIRMER ── */
    function dismiss(event, id) {
      event.preventDefault();
      const idx = tables.findIndex(t=>t.id===id);
      if (idx > -1) {
        logEvent(id, tables[idx].batt, 'dismissed');
        tables[idx].waiting = false;
        document.getElementById('card-'+id)?.classList.remove('calling');
        updateSummary();
      }
    }

    /* ── HORLOGE ── */
    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent =
        now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      document.getElementById('clock-date').textContent =
        now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    }

    /* ── MODAL STATE ── */
    let activeTab = 'summary', selectedDate = todayKey();

    function openReport() {
      activeTab = 'summary'; selectedDate = todayKey();
      document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
      populateDateSelect(); renderModal();
      document.getElementById('modal-overlay').classList.add('open');
    }
    function closeReport() { document.getElementById('modal-overlay').classList.remove('open'); }
    function overlayClick(e) { if (e.target===document.getElementById('modal-overlay')) closeReport(); }
    function switchTab(tab,btn) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderModal();
    }
    function onDateChange() { selectedDate = document.getElementById('date-select').value; renderModal(); }

    /* ── DATE SELECT ── */
    function populateDateSelect() {
      const log = loadLog(), days = Object.keys(log).sort().reverse(), today = todayKey();
      const all = days.includes(today) ? days : [today,...days];
      const sel = document.getElementById('date-select');
      sel.innerHTML = '';
      all.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = formatDateLabel(d);
        if (d===selectedDate) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function formatDateLabel(ds) {
      const d = new Date(ds+'T12:00:00'), today = todayKey();
      const yest = new Date(); yest.setDate(yest.getDate()-1);
      const yKey = yest.toISOString().slice(0,10);
      if (ds===today) return "Aujourd'hui · "+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      if (ds===yKey)  return 'Hier · '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    }

    /* ── RENDER MODAL ── */
    function renderModal() {
      const log = loadLog();
      const events = (log[selectedDate]||{events:[]}).events;
      const dismissed = events.filter(e=>e.status==='dismissed');
      document.getElementById('modal-subtitle').textContent =
        formatDateLabel(selectedDate).replace(' · ',' – ').toUpperCase();
      document.getElementById('modal-footer-info').textContent =
        events.length===0
          ? 'Aucun événement enregistré pour ce jour'
          : `${events.length} événement${events.length>1?'s':''} enregistré${events.length>1?'s':''}`;
      const body = document.getElementById('modal-body');
      if (activeTab==='summary')  body.innerHTML = renderSummaryTab(events,dismissed);
      if (activeTab==='tables')   body.innerHTML = renderTablesTab(events);
      if (activeTab==='timeline') body.innerHTML = renderTimelineTab(events);
    }

    /* ── ONGLET RÉSUMÉ ── */
    function renderSummaryTab(events, dismissed) {
      if (!events.length) return emptyState();
      const uniqTables = [...new Set(dismissed.map(e=>e.table))].length;
      const lowBatt    = events.filter(e=>e.batt<20).length;
      const peakMap    = {};
      events.forEach(e => {
        const ts = e.dismissedAt||e.calledAt; if(!ts) return;
        const h  = new Date(ts).getHours();
        peakMap[h] = (peakMap[h]||0)+1;
      });
      let heurePointe = '—';
      if (Object.keys(peakMap).length) {
        const top = Object.entries(peakMap).sort((a,b)=>b[1]-a[1])[0][0];
        heurePointe = String(top).padStart(2,'0')+'h00';
      }
      return `
        <div class="report-stats">
          <div class="r-stat">
            <div class="r-stat-label">Appels traités</div>
            <div class="r-stat-val orange">${dismissed.length}</div>
          </div>
          <div class="r-stat">
            <div class="r-stat-label">Tables servies</div>
            <div class="r-stat-val">${uniqTables}</div>
          </div>
          <div class="r-stat">
            <div class="r-stat-label">Alerte batterie</div>
            <div class="r-stat-val ${lowBatt>0?'red':'green'}">${lowBatt}</div>
          </div>
          <div class="r-stat">
            <div class="r-stat-label">Heure de pointe</div>
            <div class="r-stat-val" style="font-size:20px;padding-top:6px;">${heurePointe}</div>
          </div>
        </div>
        ${renderBarChart(buildHourlyData(events))}`;
    }

    function buildHourlyData(events) {
      const h = {};
      for (let i=7;i<=22;i++) h[i]=0;
      events.forEach(e => {
        const ts = e.dismissedAt||e.calledAt; if(!ts) return;
        const hr = new Date(ts).getHours();
        if (hr>=7&&hr<=22) h[hr]++;
      });
      return h;
    }

    function renderBarChart(data) {
      const max  = Math.max(...Object.values(data),1);
      const bars = Object.entries(data).map(([h,count]) => {
        const pct = Math.round((count/max)*100);
        return `
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0;">
            <span style="font-size:10px;color:rgba(255,255,255,0.6);min-height:14px;">${count||''}</span>
            <div style="width:100%;height:80px;display:flex;align-items:flex-end;">
              <div style="width:100%;height:${Math.max(pct,3)}%;background:${count>0?'var(--accent)':'#2a1c10'};border-radius:3px 3px 0 0;transition:height 0.3s;"></div>
            </div>
            <span style="font-size:9px;color:rgba(255,255,255,0.5);transform:rotate(-45deg);transform-origin:top left;margin-top:6px;white-space:nowrap;">${String(h).padStart(2,'0')}h</span>
          </div>`;
      }).join('');
      return `
        <div class="chart-container">
          <div class="chart-label">Appels par heure</div>
          <div style="display:flex;gap:3px;align-items:flex-end;">${bars}</div>
        </div>`;
    }

    /* ── ONGLET PAR TABLE ── */
    function renderTablesTab(events) {
      if (!events.length) return emptyState();
      const map = {};
      tables.forEach(t => { map[t.id]={calls:0,dismissed:0,lowBatt:0,lastSeen:'—'}; });
      events.forEach(e => {
        if (!map[e.table]) map[e.table]={calls:0,dismissed:0,lowBatt:0,lastSeen:'—'};
        const ts = e.dismissedAt||e.calledAt;
        if (e.status==='dismissed') map[e.table].dismissed++;
        else                        map[e.table].calls++;
        if (e.batt<20) map[e.table].lowBatt++;
        if (ts) map[e.table].lastSeen = formatTime(ts);
      });
      const rows = Object.entries(map)
        .sort((a,b)=>(b[1].dismissed+b[1].calls)-(a[1].dismissed+a[1].calls))
        .map(([id,d]) => {
          const total = d.dismissed+d.calls;
          if (!total) return '';
          const pill = d.lowBatt>0
            ? `<span class="pill pill-red">⚠ ${d.lowBatt}</span>`
            : `<span class="pill pill-green">OK</span>`;
          return `
            <tr>
              <td><span class="td-table-num">${id}</span></td>
              <td>${total}</td>
              <td>${d.dismissed}</td>
              <td>${pill}</td>
              <td style="color:rgba(255,255,255,0.65);font-size:12px;">${d.lastSeen}</td>
            </tr>`;
        }).join('');
      return `
        <table class="report-table">
          <thead>
            <tr>
              <th>Table</th><th>Appels</th><th>Traités</th><th>Batterie</th><th>Dernière vue</th>
            </tr>
          </thead>
          <tbody>
            ${rows||'<tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.4);padding:30px;">Aucune activité enregistrée.</td></tr>'}
          </tbody>
        </table>`;
    }

    /* ── ONGLET CHRONOLOGIE ── */
    function renderTimelineTab(events) {
      if (!events.length) return emptyState();
      const sorted = [...events].sort((a,b) => {
        const ta=a.dismissedAt||a.calledAt||'';
        const tb=b.dismissedAt||b.calledAt||'';
        return tb.localeCompare(ta);
      });
      const items = sorted.map(e => {
        const ts    = e.dismissedAt||e.calledAt;
        const isDone= e.status==='dismissed';
        return `
          <div class="tl-item">
            <span class="tl-time">${ts?formatTime(ts):'—'}</span>
            <div class="tl-dot" style="background:${isDone?'var(--ok)':'var(--warn)'}"></div>
            <div class="tl-content">
              <div class="tl-title">${isDone?'Appel traité':'Appel entrant'}</div>
              <div class="tl-sub">Table ${e.table} · Batterie ${e.batt}%${e.batt<20?' ⚠':''}</div>
            </div>
          </div>`;
      }).join('');
      return `<div class="timeline">${items}</div>`;
    }

    function emptyState() {
      return `
        <div class="empty-state">
          <div class="es-icon">☕</div>
          <p>Aucun événement enregistré pour ce jour.<br>Les appels confirmés apparaîtront ici.</p>
        </div>`;
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }

    /* ── DONNÉES RAPPORT ── */
    function collectReportData() {
      return (loadLog()[selectedDate]||{events:[]}).events;
    }

    function buildTableStats(events) {
      const map = {};
      tables.forEach(t => { map[t.id]={id:t.id,calls:0,dismissed:0,lowBatt:0,lastSeen:'—'}; });
      events.forEach(e => {
        if (!map[e.table]) map[e.table]={id:e.table,calls:0,dismissed:0,lowBatt:0,lastSeen:'—'};
        const ts = e.dismissedAt||e.calledAt;
        if (e.status==='dismissed') map[e.table].dismissed++;
        else                        map[e.table].calls++;
        if (e.batt<20) map[e.table].lowBatt++;
        if (ts) map[e.table].lastSeen = formatTime(ts);
      });
      return Object.values(map)
        .filter(r=>r.calls+r.dismissed>0)
        .sort((a,b)=>(b.dismissed+b.calls)-(a.dismissed+a.calls));
    }

    /* ════════════════════════════════════
       EXPORT PDF
    ════════════════════════════════════ */
    function exportPDF() {
      if (typeof window.jspdf==='undefined') {
        alert("La bibliothèque PDF n'est pas encore chargée, veuillez réessayer."); return;
      }
      const events = collectReportData();
      if (!events.length) { alert('Aucun événement à exporter pour ce jour.'); return; }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

      const BROWN  = [30, 20, 8];
      const ACCENT = [200, 115, 42];
      const LIGHT  = [248, 240, 228];
      const MIDLIT = [220, 200, 170];
      const DARK   = [42, 28, 16];
      const RED    = [224, 48, 32];
      const GREEN  = [74, 184, 90];
      const W = 210, MARGIN = 14;

      const dismissed   = events.filter(e=>e.status==='dismissed');
      const uniqTables  = [...new Set(dismissed.map(e=>e.table))].length;
      const lowBattEvts = events.filter(e=>e.batt<20).length;
      const peakMap     = {};
      events.forEach(e => {
        const ts = e.dismissedAt||e.calledAt; if(!ts) return;
        peakMap[new Date(ts).getHours()] = (peakMap[new Date(ts).getHours()]||0)+1;
      });
      let heurePointe = '—';
      if (Object.keys(peakMap).length) {
        const top = Object.entries(peakMap).sort((a,b)=>b[1]-a[1])[0][0];
        heurePointe = String(top).padStart(2,'0')+'h00';
      }

      function pageHeader(label) {
        doc.setFillColor(...BROWN); doc.rect(0,0,W,22,'F');
        doc.setFillColor(...ACCENT); doc.rect(0,22,W,2.5,'F');
        doc.setTextColor(...LIGHT);
        doc.setFontSize(16); doc.setFont('helvetica','bold');
        doc.text('Café Manager', MARGIN, 14);
        doc.setFontSize(9); doc.setFont('helvetica','normal');
        doc.text(label, W-MARGIN, 14, {align:'right'});
        return 32;
      }

      function sectionTitle(y, title) {
        doc.setFillColor(...DARK); doc.rect(MARGIN,y,W-MARGIN*2,7.5,'F');
        doc.setFillColor(...ACCENT); doc.rect(MARGIN,y,2.5,7.5,'F');
        doc.setTextColor(...ACCENT);
        doc.setFontSize(9); doc.setFont('helvetica','bold');
        doc.text(title, MARGIN+6, y+5.2);
        return y+13;
      }

      /* PAGE 1 */
      let y = pageHeader('Rapport journalier – '+formatDateLabel(selectedDate));
      doc.setTextColor(140,100,60); doc.setFontSize(8); doc.setFont('helvetica','normal');
      doc.text('Généré le : '+new Date().toLocaleString('fr-FR'), MARGIN, y);
      y += 11;

      y = sectionTitle(y, 'RÉSUMÉ');
      const kpis = [
        { label:'Appels traités',   value:String(dismissed.length),  color:ACCENT },
        { label:'Tables servies',   value:String(uniqTables),         color:LIGHT  },
        { label:'Alertes batterie', value:String(lowBattEvts),        color:lowBattEvts>0?RED:GREEN },
        { label:'Heure de pointe',  value:heurePointe,                color:LIGHT  }
      ];
      const cardW = (W-MARGIN*2-9)/4;
      kpis.forEach((k,i) => {
        const x = MARGIN + i*(cardW+3);
        doc.setFillColor(...DARK); doc.roundedRect(x,y,cardW,20,2,2,'F');
        doc.setFillColor(...ACCENT); doc.rect(x,y,cardW,1.5,'F');
        doc.setTextColor(...k.color); doc.setFontSize(15); doc.setFont('helvetica','bold');
        doc.text(k.value, x+cardW/2, y+13, {align:'center'});
        doc.setTextColor(160,120,70); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
        doc.text(k.label, x+cardW/2, y+18.5, {align:'center'});
      });
      y += 28;

      y = sectionTitle(y, 'APPELS PAR HEURE');
      const hourly = buildHourlyData(events);
      const maxH = Math.max(...Object.values(hourly),1);
      const barMaxH = 30;
      const barW = (W-MARGIN*2)/Object.keys(hourly).length;
      doc.setFillColor(26,16,8); doc.roundedRect(MARGIN,y,W-MARGIN*2,barMaxH+10,2,2,'F');
      Object.entries(hourly).forEach(([h,count],i) => {
        const x  = MARGIN+i*barW;
        const bh = count>0 ? Math.max((count/maxH)*barMaxH,2) : 1;
        const by = y+barMaxH-bh+2;
        doc.setFillColor(...(count>0?ACCENT:[42,28,16]));
        doc.rect(x+1,by,barW-2,bh,'F');
        if (count>0) {
          doc.setTextColor(...LIGHT); doc.setFontSize(5); doc.setFont('helvetica','bold');
          doc.text(String(count), x+barW/2, by-1, {align:'center'});
        }
        doc.setTextColor(160,120,70); doc.setFontSize(5); doc.setFont('helvetica','normal');
        doc.text(String(h).padStart(2,'0'), x+barW/2, y+barMaxH+8, {align:'center'});
      });
      y += barMaxH+16;

      y = sectionTitle(y, 'PERFORMANCE PAR TABLE');
      const tableStats = buildTableStats(events);
      doc.autoTable({
        startY:y, margin:{left:MARGIN,right:MARGIN},
        head:[['Table','Total appels','Traités','En attente','Alerte batt.','Dernière vue']],
        body:tableStats.map(r=>[
          'Table '+r.id, r.calls+r.dismissed, r.dismissed, r.calls,
          r.lowBatt>0?'⚠ '+r.lowBatt:'OK', r.lastSeen
        ]),
        foot:[['Totaux',
          tableStats.reduce((s,r)=>s+r.calls+r.dismissed,0),
          tableStats.reduce((s,r)=>s+r.dismissed,0),
          tableStats.reduce((s,r)=>s+r.calls,0),
          tableStats.reduce((s,r)=>s+r.lowBatt,0),''
        ]],
        styles:{fontSize:8,cellPadding:3.5,font:'helvetica',textColor:LIGHT,fillColor:BROWN},
        headStyles:{fillColor:DARK,textColor:MIDLIT,fontStyle:'bold',fontSize:7.5},
        footStyles:{fillColor:DARK,textColor:ACCENT,fontStyle:'bold'},
        alternateRowStyles:{fillColor:[38,24,12]},
        columnStyles:{0:{fontStyle:'bold'},1:{halign:'center'},2:{halign:'center'},3:{halign:'center'},4:{halign:'center'},5:{halign:'center',fontSize:7}},
        didParseCell:(data)=>{
          if (data.section==='body'&&data.column.index===4) {
            data.cell.styles.textColor=(typeof data.cell.raw==='string'&&data.cell.raw.startsWith('⚠'))?RED:GREEN;
          }
        }
      });

      /* PAGE 2 */
      doc.addPage();
      y = pageHeader('Chronologie – '+formatDateLabel(selectedDate));
      y = sectionTitle(y, 'JOURNAL DES ÉVÉNEMENTS');
      const sorted = [...events].sort((a,b)=>{
        const ta=a.dismissedAt||a.calledAt||'';
        const tb=b.dismissedAt||b.calledAt||'';
        return ta.localeCompare(tb);
      });
      doc.autoTable({
        startY:y, margin:{left:MARGIN,right:MARGIN},
        head:[['Heure','Table','Événement','Batterie','État batterie']],
        body:sorted.map(e=>{
          const ts=e.dismissedAt||e.calledAt;
          return [ts?formatTime(ts):'—','Table '+e.table,
            e.status==='dismissed'?'Appel traité':'Appel entrant',
            e.batt+'%', e.batt<20?'FAIBLE':e.batt<40?'Moyenne':'Bonne'];
        }),
        styles:{fontSize:8,cellPadding:3.5,font:'helvetica',textColor:LIGHT,fillColor:BROWN},
        headStyles:{fillColor:DARK,textColor:MIDLIT,fontStyle:'bold',fontSize:7.5},
        alternateRowStyles:{fillColor:[38,24,12]},
        columnStyles:{0:{fontStyle:'bold'},2:{cellWidth:40},3:{halign:'center'},4:{halign:'center'}},
        didParseCell:(data)=>{
          if (data.section==='body') {
            if (data.column.index===4) {
              const v=data.cell.raw;
              data.cell.styles.textColor=v==='FAIBLE'?RED:v==='Moyenne'?[220,140,40]:GREEN;
            }
            if (data.column.index===2) {
              data.cell.styles.textColor=data.cell.raw==='Appel traité'?GREEN:ACCENT;
            }
          }
        }
      });

      /* Pied de page */
      const pageCount = doc.internal.getNumberOfPages();
      for (let i=1;i<=pageCount;i++) {
        doc.setPage(i);
        doc.setFillColor(...BROWN); doc.rect(0,290,W,7,'F');
        doc.setFillColor(...ACCENT); doc.rect(0,290,W,0.8,'F');
        doc.setTextColor(150,110,60); doc.setFontSize(7); doc.setFont('helvetica','normal');
        doc.text('Café Manager · '+selectedDate, MARGIN, 294.5);
        doc.text('Page '+i+' / '+pageCount, W-MARGIN, 294.5, {align:'right'});
      }

      doc.save('rapport-cafe-'+selectedDate+'.pdf');
    }

    /* ── DONNÉES DÉMO ── */
    function seedDemoData() {
      const log = loadLog();
      if (Object.keys(log).length>0) return;
      const batts={'01':88,'02':72,'03':12,'04':60,'05':34,'06':98,'07':45,'08':82,'09':19,'10':91,'11':55,'12':67};
      function mk(da,h,m){const d=new Date();d.setDate(d.getDate()-da);d.setHours(h,m,0,0);return d.toISOString();}
      function add(da,evts){const d=new Date();d.setDate(d.getDate()-da);const k=d.toISOString().slice(0,10);if(!log[k])log[k]={events:[]};evts.forEach(e=>log[k].events.push(e));}
      add(1,[
        {table:'03',batt:batts['03'],dismissedAt:mk(1,9,14), status:'dismissed'},
        {table:'07',batt:batts['07'],dismissedAt:mk(1,10,32),status:'dismissed'},
        {table:'01',batt:batts['01'],dismissedAt:mk(1,11,5), status:'dismissed'},
        {table:'02',batt:batts['02'],dismissedAt:mk(1,11,47),status:'dismissed'},
        {table:'10',batt:batts['10'],dismissedAt:mk(1,13,20),status:'dismissed'},
        {table:'05',batt:batts['05'],dismissedAt:mk(1,14,3), status:'dismissed'},
        {table:'09',batt:19,         dismissedAt:mk(1,15,50),status:'dismissed'},
        {table:'03',batt:batts['03'],dismissedAt:mk(1,16,22),status:'dismissed'},
      ]);
      add(2,[
        {table:'06',batt:batts['06'],dismissedAt:mk(2,8,40), status:'dismissed'},
        {table:'11',batt:batts['11'],dismissedAt:mk(2,9,55), status:'dismissed'},
        {table:'04',batt:batts['04'],dismissedAt:mk(2,12,10),status:'dismissed'},
        {table:'08',batt:batts['08'],dismissedAt:mk(2,13,45),status:'dismissed'},
        {table:'12',batt:batts['12'],dismissedAt:mk(2,14,30),status:'dismissed'},
      ]);
      add(3,[
        {table:'01',batt:batts['01'],dismissedAt:mk(3,10,5), status:'dismissed'},
        {table:'02',batt:batts['02'],dismissedAt:mk(3,11,20),status:'dismissed'},
        {table:'03',batt:12,         dismissedAt:mk(3,12,0), status:'dismissed'},
        {table:'07',batt:batts['07'],dismissedAt:mk(3,13,35),status:'dismissed'},
        {table:'10',batt:batts['10'],dismissedAt:mk(3,15,10),status:'dismissed'},
        {table:'09',batt:19,         dismissedAt:mk(3,17,45),status:'dismissed'},
      ]);
      saveLog(log);
    }

    /* ── INIT ── */
    seedDemoData();
    updateClock();
    setInterval(updateClock, 1000);
    updateSummary();
    renderGrid();
    tables.filter(t=>t.waiting).forEach(t=>logEvent(t.id, t.batt, 'called'));
  </script>
</body>
